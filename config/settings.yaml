# Meester settings. Everything tunable lives here, not in code.

harvest:
  # Politeness: these are free public endpoints and we intend to keep them that way.
  concurrency: 8
  timeout_seconds: 45
  retries: 2
  user_agent: "Meester/0.1 (personal job search assistant)"
  # Drop postings older than this. Stale roles are usually filled or ghosts.
  max_age_days: 30

remote:
  # US-first, but non-US remote is acceptable.
  require_remote: true
  # Accept a role if it is remote in ANY of these. "ANY" disables the check.
  accept_countries: [US, CA, GB, EU, ANYWHERE]
  # Hybrid is not remote. Kept separate so it can be turned on later.
  accept_hybrid: false

store:
  path: data/jobs.jsonl
  seen_path: data/seen.json
  # The readable page. This is the only output anyone but a developer opens.
  report_path: data/jobs.html

llm:
  # Hard stop on API calls per day - a looping bug costs one day, not a month.
  daily_call_cap: 300

apply:
  # The one flip: false = every application waits for her tap in the queue.
  # After the supervised thirty prove the adapters, set true and matches at or
  # above auto_propose_min_score are approved automatically. Dream-list
  # companies always wait for her regardless.
  auto_submit: false
  # Propose For-you matches at/above this gate score into the queue each
  # harvest (null = only manual "Queue" clicks).
  auto_propose_min_score: null
  daily_cap: 15

tracking:
  # Google Sheet that mirrors every applied job (one row each on an
  # "Applications" tab: date, company, title, how, link). Append-only - her
  # own notes on the sheet are never touched. null = reuse clay_sheet_id
  # below; both null = no sheet tracking, everything else unaffected.
  sheet_id: null

outreach:
  # Warm outreach stays quality-only. Weekly cap on notes actually sent.
  weekly_cap: 5
  # Clay: her Mac POSTs {company, role, fingerprint} here; the Clay workflow
  # enriches and exports contacts to the Google Sheet below, which her Mac
  # polls. Both blank = outreach disabled, everything else still works.
  clay_webhook_url: null
  clay_sheet_id: null
