# Watchlist of remote-friendly companies, keyed by ATS board token.
#
# This is a SEED list of candidates, not a verified one. Tokens are guesses based
# on the usual `company-name` convention and many will be wrong or stale.
# Run `python -m meester verify-companies` to probe every token and rewrite this
# file with only the ones that actually resolve. Never trust an unverified token.
#
# The whole point of this list is timing: a role appears on the company's own
# board hours-to-days before aggregators index it. Growing this list is the
# single highest-leverage maintenance task in the system.

